# Déploiement visuel unique de la branche main.
# Cloudflare Workers Builds: root directory = web
# Build: npm ci && npm run build
# Deploy: npx --yes wrangler@4 deploy
name = "mycoradar-preview"
main = "./worker.js"
preview_urls = false
compatibility_date = "2026-10-29"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]
not_found_handling = "single-page-application"
