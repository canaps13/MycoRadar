[project]
name = "mycoradar-api"
version = "0.1.0"
description = "MycoRadar API bootstrap; no scientific predictions published yet."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api/src"]
