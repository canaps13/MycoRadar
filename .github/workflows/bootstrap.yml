name: Bootstrap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: python_install
        run: uv sync --locked
      - id: python_unit
        run: uv run --locked pytest -m "not integration"
      - id: python_lint
        run: uv run --locked ruff check .
      - id: python_format
        run: uv run --locked ruff format --check .
      - id: python_types
        run: uv run --locked mypy
      - id: web_install
        run: npm --prefix web ci
      - id: web_lint
        run: npm --prefix web run lint
      - id: web_types
        run: npm --prefix web run typecheck
      - id: web_unit
        run: npm --prefix web test
      - id: web_format
        run: npm --prefix web run format:check
      - id: web_build
        run: npm --prefix web run build
      - id: browser_install
        run: npx playwright install --with-deps chromium
        working-directory: web
      - id: browser_tests
        run: npm --prefix web run test:e2e
      - id: whitespace
        run: git diff --check
      - name: Validation outcomes (including skipped checks)
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: >-
          python scripts/ci_summary.py
          python_install python_unit python_lint python_format python_types
          web_install web_lint web_types web_unit web_format web_build
          browser_install browser_tests whitespace
