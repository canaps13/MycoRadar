name: Local environment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose and PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "55432"
      PGDATABASE: mycoradar_test_ci
      PGUSER: mycoradar
      PGPASSWORD: mycoradar-local-only
      MYCORADAR_TEST_DATABASE: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:15173
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: docker compose --env-file .env.example up --build --wait --wait-timeout 180
      - run: uv run --locked python scripts/check_local_stack.py
      - run: uv run --locked pytest -m integration
      - run: docker compose --env-file .env.example run --rm migrate
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run test:e2e
      - name: Container state and logs
        if: always()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail 100
      - name: Stop containers and preserve database volume
        if: always()
        run: docker compose --env-file .env.example stop
